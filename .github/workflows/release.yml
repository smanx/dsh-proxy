name: Release

# 推送 v* 标签（如 v1.1.0）时自动构建 Node 版 + Go 版全部跨平台单文件程序，
# 并发布到 GitHub Release；也可在 Actions 页面手动触发（需填写 version，如 v1.1.0）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（仅手动触发时使用，如 v1.1.0）'
        required: false
        default: ''

permissions:
  contents: write # gh release 需要写 Release 的权限

jobs:
  build-and-release:
    name: 构建并发布 Release（Node + Go）
    runs-on: ubuntu-latest # SEA 与 Go 均支持跨平台构建，一个 runner 产出全部 10 个文件
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ---------------------------- Node 版 ----------------------------
      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: 安装 Node 依赖
        working-directory: node
        run: npm ci

      - name: 缓存 Node 二进制下载（node/.sea-cache）
        uses: actions/cache@v4
        with:
          path: node/.sea-cache
          key: sea-cache-${{ runner.os }}-22

      - name: 构建 Node 版（SEA 单文件，5 平台）
        working-directory: node
        env:
          DSH_PROXY_VERSION: ${{ github.event.inputs.version }}
        run: |
          # 版本号注入：标签触发用 GITHUB_REF_NAME（去 v 前缀），手动触发用输入的 version
          VERSION="${DSH_PROXY_VERSION:-${GITHUB_REF_NAME#v}}"
          node build.js --version "$VERSION"

      # ---------------------------- Go 版 ----------------------------
      - name: 安装 Go（版本取 go/go.mod）
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: true

      - name: 构建 Go 版（静态交叉编译，5 平台）
        working-directory: go
        env:
          DSH_PROXY_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="${DSH_PROXY_VERSION:-${GITHUB_REF_NAME#v}}"
          pwsh -File ./build.ps1 -Version "$VERSION"

      # ---------------------------- 发布 ----------------------------
      - name: 汇总产物并生成校验和
        run: |
          mkdir -p release-assets
          # Node 版产物为 dsh-proxy-<平台>，Go 版产物为 dsh-proxy-go-<平台>（已避免同名冲突）
          cp node/dist/dsh-proxy-* release-assets/
          cp go/dist/dsh-proxy-go-* release-assets/
          cd release-assets
          sha256sum dsh-proxy-* > SHA256SUMS.txt
          ls -la

      - name: 发布到 GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 标签触发用标签名；手动触发用输入的 version（标记为 prerelease）
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
            EXTRA="--prerelease"
          else
            TAG="${GITHUB_REF_NAME}"
            EXTRA=""
          fi
          cd release-assets
          # 首次创建 Release；若已存在（如重跑）则改为补传/覆盖资产
          gh release create "$TAG" dsh-proxy-* SHA256SUMS.txt \
            --generate-notes --title "dsh-proxy $TAG" $EXTRA \
          || gh release upload "$TAG" dsh-proxy-* SHA256SUMS.txt --clobber
